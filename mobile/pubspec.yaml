name: dupermarket
description: Shopping App Simulator — Flutter client
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0
  dio: ^5.7.0
  intl: ^0.20.2
  flutter_riverpod: ^2.6.1
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  path_provider: ^2.1.4
  # US2 (T066): social sign-in. `firebase_auth` covers all three providers through
  # `signInWithProvider`, so no per-provider SDK is needed.
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  # US4 (T100): the delivery map. Route geometry sits behind `RouteProvider`, so replacing the
  # straight line with road routing later does not touch the map widget.
  google_maps_flutter: ^2.14.2
  # Still to land with their features:
  #   cached_network_image, firebase_messaging, flutter_local_notifications, connectivity_plus
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.13
  sqlite3: ^2.4.6
  # golden_toolkit lands with task T037 (the responsive × text-scale golden matrix)

flutter:
  uses-material-design: true
  generate: true
