[project]
name = "dupermarket-seed"
version = "0.1.0"
description = "Catalogue seed pipeline — ingest, normalise, resolve images, upload to R2"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "pillow>=11.0",
    "boto3>=1.35",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dupermarket_seed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ001", "DTZ003", "DTZ005"]
