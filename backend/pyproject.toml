[project]
name = "dupermarket-api"
version = "0.1.0"
description = "Shopping App Simulator backend — FastAPI resource server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyjwt[crypto]>=2.10",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pyyaml>=6.0",
    "openapi-spec-validator>=0.7",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dupermarket_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]  # "." so tests/ helper modules are importable
# Benchmarks are opt-in: they seed thousands of rows, and a suite people skip because it is slow
# protects nothing. Run them with `pytest -m performance`.
addopts = "-ra --strict-markers -m 'not performance'"
asyncio_mode = "auto"
markers = [
    "contract: asserts the published API contract",
    "integration: needs a live database",
    "unit: pure, no I/O",
    "performance: benchmarks against a full-size catalogue; slow, excluded by default",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "DTZ"]

[tool.ruff.lint.per-file-ignores]
# Constitution Principle III / research D12: time must be injected, never read ambiently, or the
# delivery simulation stops being testable. DTZ005 bans a naive `datetime.now()`; DTZ003 bans
# `datetime.utcnow()`. deps.py is the one place a real clock may be constructed, and tests may
# build fixed datetimes freely.
"src/dupermarket_api/deps.py" = ["DTZ003", "DTZ005"]
"tests/**" = ["DTZ001", "DTZ003", "DTZ005"]

[tool.mypy]
python_version = "3.12"
packages = ["dupermarket_api"]
mypy_path = "src"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
